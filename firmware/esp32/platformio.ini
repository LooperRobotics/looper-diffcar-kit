[env:esp32s3]
platform = espressif32 @ 7.0.1   ; 钉死：内含 Arduino 2.0.17（框架包 3.20017.241212），升级会换掉 USB 驱动（USB 网卡功能依赖这一版）
board = esp32-s3-devkitc-1
framework = arduino

; 两个 USB 口都当控制台：Serial=原生USB(GPIO19/20)，Serial0=UART0(GPIO43/44→CH343)，
; 插哪个口都能用。CDC_ON_BOOT=1 是让 Serial 指向 USB、把 UART0 让给 Serial0 的开关
; USB_MODE=0 才走 TinyUSB(=1 是硬件 USB-Serial-JTAG，做不了自定义类)。改了之后原生
; USB 口归 TinyUSB 管，烧录仍走左边 CH343 口和 OTA，不受影响。
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCFG_TUD_NCM=1
    -DCFG_TUD_NET_MTU=1514
    ; 实测 NTB帧数满 78 万次 vs 容量满 4079 次 —— 卡的是帧数不是容量(3200B 装得下，但
    ; TCP ACK 才 60B，8 个才占 500B 就算满了)。NDP 头每帧 4B，32 帧才 128B，容量富余。
    -DCFG_TUD_NCM_MAX_DATAGRAMS_PER_NTB=32
    ; 下行(主机->设备)瓶颈：Linux 的 usbnet 按设备速度给在途 URB，Full Speed 只有个位数，
    ; 于是 Looper 既发不快(上限 4.76 Mbit/s)又一满就丢(tx_dropped 18%)。队列深度改不了
    ; (内核写死)，只能让每个 URB 装更多。⚠️ 这是 OUT 不是 IN —— 之前我调的 IN 是上行，
    ; 方向错了，所以当时"加大 NTB 无效"的结论不成立。
    ; ⚠️ 上面那条「IN 方向主要是 TCP ACK，加大容量没用」只在【上行】成立。2026-09-18 测下行
    ; (PC->Looper，走 IN)：1400B 大包下 can_xmit 拒绝里容量满 102 万次、帧数满 0 次 —— 卡的
    ; 正是容量。8192 装 1400B 只能塞 5 帧，而主机固定每 45~55ms 才取走一个 NTB，于是封顶 123KB/s。
    ; 代价：transmit_ntb 是双缓冲，加一倍就多吃 16KB RAM。
    ; 🔴 别改成 16384：2026-09-18 实测下行传满 32768B(=2 个 NTB)后必定卡死不再前进，
    ; 8192 从无此现象。容量确实是下行大包的瓶颈，但这条路走不通，得从别处想办法。
    -DCFG_TUD_NCM_OUT_NTB_MAX_SIZE=16384    ; 到顶了：Linux cdc_ncm 内部把 tx_max 钳在 16385，给 32768 也没用
    -Isrc/tinyusb_net

; N16R8：16MB flash。PSRAM 故意不开——用不上，而且开了也解不出 GPIO33-37
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; 不写死端口：电脑上插着多个 USB 串口设备时，用 pio run -t upload --upload-port <端口> 指定
monitor_speed = 115200
